<style>
:root{--navy:#102d59;--blue:#2475d0;--pale:#edf3fb;--bg:#f3f6fb;--ink:#172b4d;--muted:#78869c;--line:#e3e9f2;--red:#c43d4b;--green:#12a875;--gold:#c7a34b;--shadow:0 10px 30px rgba(16,45,89,.075)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 10% 0%,#e7eef9 0,transparent 36%),var(--bg);color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(115deg,#0b2144,#102d59 58%,#174b88);color:#fff;padding:14px max(5%,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:20;box-shadow:0 8px 24px #102d5930}
.brand{font-size:25px;font-weight:900;letter-spacing:1.2px}
.brand span{color:#8fc2ff}
.tag{background:#ffffff14;border:1px solid #ffffff25;color:#e2efff;border-radius:999px;padding:8px 14px;font-size:11px;font-weight:bold;letter-spacing:1.2px}
.header-right{display:flex;align-items:center;gap:10px}
.bell{position:relative;width:43px;height:43px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff45;color:#fff;font-size:21px;display:grid;place-items:center;padding:0}
.badge-count{position:absolute;right:-5px;top:-5px;background:#e53948;color:white;border:2px solid var(--navy);border-radius:20px;min-width:19px;height:19px;padding:0 4px;font-size:10px;display:grid;place-items:center}
main{max-width:1100px;margin:auto;padding:24px 14px 105px}
h1,h2,h3{color:var(--ink);letter-spacing:-.35px}
h1{font-size:26px;font-weight:850;margin:8px 0}
h2{font-size:19px;font-weight:800;margin:5px 0 13px}
h3{font-size:16px}
.card{background:linear-gradient(180deg,#fff,#fcfdff);border:1px solid #e2e9f2;border-radius:18px;padding:20px;margin:0 0 17px;box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:#d0def0;box-shadow:0 13px 34px rgba(16,45,89,.10)}
button{border:1px solid #174b88;border-radius:11px;padding:12px 17px;background:linear-gradient(135deg,#102d59,#2475d0);color:#fff;font-weight:750;cursor:pointer;box-shadow:0 4px 10px #102d591c;transition:transform .16s,filter .16s}
button:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#edf3fb;color:#173d70;border:1px solid #d8e5f5;box-shadow:none}
button.danger{background:linear-gradient(135deg,#b93443,#d94d5b);border-color:#b93443}
.wide{width:100%}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d8e2ef;border-radius:11px;margin:6px 0 12px;font:inherit;background:#fbfcff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px #2475d01b}
label{font-size:12px;font-weight:bold;letter-spacing:.25px;text-transform:uppercase;color:#334d70}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid #dce5f1;box-shadow:0 -8px 28px #102d5910}
nav button{white-space:nowrap;background:#f1f5fb;color:#49617e;border:1px solid #e0e8f2;border-radius:12px;padding:10px 5px;min-height:48px;font-size:12px;box-shadow:none}
nav button.active{background:linear-gradient(135deg,#102d59,#2475d0);color:#fff;border-color:#2475d0}
.balance-card{position:relative;overflow:hidden;background:linear-gradient(125deg,#0b2144,#102d59 58%,#2166ad);color:#fff;padding:25px;border:1px solid #2a609e;border-radius:21px;margin-bottom:15px;box-shadow:0 14px 32px #102d5930}
.balance-card:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff20;border-radius:50%;right:-70px;top:-100px;box-shadow:0 0 0 24px #ffffff08,0 0 0 50px #ffffff06;pointer-events:none}
.balance{font-size:36px;font-weight:900;letter-spacing:-1px;margin:12px 0}
.balance-card small{letter-spacing:1.5px;font-weight:bold;color:#c9ddf7}
.balance-card>button{position:relative;z-index:1;background:#fff;color:var(--navy);min-width:130px;border:0}
.hidden{display:none!important}
.welcome-line{font-size:18px;font-weight:900;letter-spacing:-.25px;color:var(--navy);margin:5px 0 0}
.home-promo{position:relative;z-index:1;max-width:590px;margin-top:20px;padding-top:16px;border-top:1px solid #ffffff35}
.promo-kicker{display:inline-block;color:#bcd9ff;font-size:10px;font-weight:900;letter-spacing:1.8px}
.home-promo h2{color:#fff;font-size:23px;line-height:1.2;font-weight:900;letter-spacing:-.55px;margin:7px 0}
.home-promo p{max-width:510px;color:#e0ebfb;font-size:13px;line-height:1.6;margin:0 0 13px}
.home-promo .promo-cta{background:#fff;color:var(--navy);border:1px solid #fff;border-radius:10px;padding:10px 15px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.quick{background:linear-gradient(180deg,#fff,#f8faff);border:1px solid #e0e8f2;border-radius:15px;padding:15px 8px;text-align:center;color:var(--navy);font-weight:bold}
.quick b{display:block;font-size:25px;margin-bottom:7px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.categories{display:flex;gap:8px;overflow:auto;padding:5px 0 15px}
.categories button{white-space:nowrap;background:#f7f9fd;color:#486080;border:1px solid #e0e8f2;border-radius:999px;padding:10px 15px}
.categories button.active{background:var(--navy);color:white;border-color:var(--navy)}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.game{position:relative;overflow:hidden;background:linear-gradient(160deg,#fff,#f8faff);border:1px solid #e0e8f2;border-radius:16px;padding:16px}
.game-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#e8f0fb,#d9e7f8);font-size:26px}
.game h3{margin:13px 0 5px;font-size:16px}
.game p,.muted{line-height:1.5;color:var(--muted);font-size:13px}
.game button{width:100%;padding:10px 12px}
.game-top{display:flex;justify-content:space-between;align-items:center}
.fav{background:#edf3fb!important;color:#174b88!important;border:1px solid #dce7f5!important;padding:7px 10px}
.play-balance{background:linear-gradient(110deg,#eff5fd,#e4eefb);border:1px solid #d2e1f4;border-radius:13px;padding:12px 15px;margin:12px 0 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.play-balance strong{font-size:20px;color:#174b88}
.odds-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:12px 0}
.odd-box{position:relative;background:linear-gradient(180deg,#fff,#f8fbff);color:#18365d;border:1px solid #d8e4f2;border-radius:13px;text-align:left;padding:14px;min-height:84px}
.odd-box .odd-name{font-size:11px;font-weight:800;display:block;letter-spacing:.65px;color:#71829a}
.odd-box .odd-value{font-size:23px;font-weight:900;display:block;margin-top:7px;color:#174b88}
.odd-box.selected{border:2px solid var(--blue);background:linear-gradient(145deg,#eff5ff,#e1edff)}
.lock{position:absolute;right:9px;top:7px;font-size:17px}
.special-odd{background:linear-gradient(145deg,#fff8e6,#f2d995 52%,#fff3d0);border:1px solid #d6b45f;color:#5b4515}
.special-odd .odd-value{color:#795713}
.result-panel{padding:18px;border-radius:16px;margin:14px 0;color:white;text-align:center;font-weight:900}
.won{background:linear-gradient(120deg,#087c50,#19c889,#08764c)}
.lost{background:linear-gradient(120deg,#851c2b,#d33e50,#811b2a)}
.result-panel strong{font-size:25px;display:block;margin:5px}
.result-detail{font-size:13px;font-weight:normal}
.support-link{display:flex;gap:12px;align-items:center;border:1px solid #e0e8f2;border-radius:13px;padding:13px;margin:8px 0;text-decoration:none;color:var(--ink);background:#fbfcff}
.support-link .emoji{font-size:23px}
.support-link small{display:block;color:var(--muted)}
.info{background:#eff5fd;border:1px solid #dce7f5;color:#486080;padding:12px;border-radius:9px;font-size:13px}
.msg{font-size:13px;color:var(--green)}
.error{color:var(--red)}
.chat-list,.wallet-history{max-height:560px;overflow:auto;border:1px solid #e0e8f2;border-radius:13px;padding:10px;background:#fcfdff}
.bubble{padding:10px;border-radius:10px;background:#eef4fc;margin:7px;max-width:88%;font-size:13px}
.mine{margin-left:auto;background:#e4eefb}
.bubble small{display:block;color:var(--muted)}
.conversation{padding:12px;border:1px solid #e0e8f2;border-radius:9px;margin:7px 0;cursor:pointer}
.notification-panel{position:absolute;right:5%;top:66px;width:min(390px,90vw);max-height:70vh;overflow:auto;background:#fff;color:var(--ink);border:1px solid #dce5f1;border-radius:17px;box-shadow:0 18px 45px #102d5928;padding:15px;z-index:30}
.notification-item{padding:12px 4px;border-bottom:1px solid var(--line)}
.notification-item.unread{background:#eff5fd;padding:12px;border-radius:9px}
.notification-item small{display:block;color:var(--muted);margin-top:5px}
footer{text-align:center;padding:24px 24px 90px;color:var(--muted);font-size:12px}
.tx-item{padding:15px 3px 13px}
.tx-main{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tx-amount{font-size:16px;font-weight:900;white-space:nowrap}
.tx-label{font-size:12px;font-weight:900;text-align:right}
.tx-description{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
.tx-date{font-size:11px;color:var(--muted);margin-top:3px}
.tx-green{color:#16a34a!important}.tx-red{color:#dc2626!important}
.tx-divider{height:1px;background:#e8edf5;margin:0;border:0}
.empty-history{padding:18px 5px;color:var(--muted);font-size:13px}
details{border:1px solid #e2e9f2;border-radius:12px;padding:13px 14px;margin:9px 0;background:#fbfcff}
details[open]{background:#f5f8fd}
summary{font-weight:750;color:#31547f;cursor:pointer}
:focus-visible{outline:3px solid #6ca5ed;outline-offset:2px}
@media(max-width:700px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,1fr)}main{padding:17px 12px 105px}header{padding:12px 4%}.card{padding:16px}.balance-card{padding:22px}.balance{font-size:32px}.home-promo h2{font-size:21px}.welcome-line{font-size:17px}}
@media(max-width:420px){.games{grid-template-columns:1fr}.odds-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{font-size:21px}.tx-amount{font-size:14px}.tx-label{font-size:11px}}
</style>
